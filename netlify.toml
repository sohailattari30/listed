[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old multi-page URLs keep working.
[[redirects]]
  from = "/today.html"
  to = "/today"
  status = 301
[[redirects]]
  from = "/dial.html"
  to = "/dial"
  status = 301
[[redirects]]
  from = "/contacts.html"
  to = "/contacts"
  status = 301
[[redirects]]
  from = "/progress.html"
  to = "/progress"
  status = 301
[[redirects]]
  from = "/onboarding.html"
  to = "/onboarding"
  status = 301

# Single-page app fallback. /auth-callback.html is intentionally NOT redirected:
# it is a client route so existing OAuth redirect URLs keep working.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
