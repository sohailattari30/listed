<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Listed. — Your market</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<style>
.shell{padding:60px 28px 52px;justify-content:space-between;min-height:100dvh}
.wordmark{font-size:13px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin-bottom:52px}
.headline{font-family:var(--display);font-size:62px;line-height:.92;font-weight:600;letter-spacing:-1.5px;margin-bottom:16px}
.headline em{font-style:italic;font-weight:400;color:var(--muted)}
.desc{font-size:15px;font-weight:500;color:var(--muted);line-height:1.65;margin-bottom:40px}
.field label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:10px}
.field input{width:100%;background:none;border:none;border-bottom:2px solid var(--line);border-radius:0;-webkit-appearance:none;padding:10px 0;font-size:22px;font-weight:600;font-family:var(--body);color:var(--black);outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--black)}
.field input::placeholder{color:rgba(10,10,10,.18);font-weight:400}
.err{font-size:13px;color:#B91C1C;margin-top:8px;display:none;font-weight:600}
.err.show{display:block}
.bottom{margin-top:auto;padding-top:40px}
.fine{font-size:12px;font-weight:500;color:var(--muted);text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="shell">
  <div>
    <div class="wordmark">Listed.</div>
    <div class="headline">Your<br><em>market?</em></div>
    <div class="desc">We'll pull 50 long-term homeowners there every morning.</div>
    <div class="field">
      <label>Zip code or city</label>
      <input id="f-territory" type="text" placeholder="94536 or Fremont, CA" autocomplete="off">
      <div class="err" id="err-territory">Please enter a zip code or city</div>
    </div>
  </div>
  <div class="bottom">
    <button class="btn" id="save-btn" onclick="saveMarket()">Get my numbers →</button>
    <div class="fine">Long-term owners only · Real numbers · Refreshed daily</div>
  </div>
</div>
<script>
// Auth guard
async function checkAuth() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }

  // If user already has zip/city set go straight to today
  const { data: profile } = await db.from('users').select('zip,city').eq('id', session.user.id).single();
  if (profile && (profile.zip || profile.city)) {
    window.location.href = 'today.html';
  }
}
checkAuth();

async function saveMarket() {
  const territory = document.getElementById('f-territory').value.trim();
  const errEl = document.getElementById('err-territory');
  const btn = document.getElementById('save-btn');

  // Clear any previous error
  errEl.classList.remove('show');

  if (!territory) {
    errEl.classList.add('show');
    return;
  }

  btn.textContent = 'Saving...';
  btn.disabled = true;

  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }

  const isZip = /^\d{5}$/.test(territory);
  const zip = isZip ? territory : '';
  const city = territory;

  const { error } = await db.from('users').update({ zip, city }).eq('id', session.user.id);

  if (error) {
    errEl.textContent = 'Something went wrong: ' + error.message;
    errEl.classList.add('show');
    btn.textContent = 'Get my numbers →';
    btn.disabled = false;
    return;
  }

  window.location.href = 'today.html';
}

document.getElementById('f-territory').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveMarket();
});
</script>
</body>
</html>
